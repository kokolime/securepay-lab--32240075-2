name: DAST Scan with ZAP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Run ZAP Baseline Scan
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Sesuaikan dengan stack aplikasi)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & Start Application
        run: |
          npm ci
          npm start &
          # Memastikan aplikasi sudah aktif di localhost:3000 dan tidak mengembalikan 404
          npx wait-on http://localhost:3000 --timeout 60000

      # Mencegah error 'Permission denied' pada /zap/wrk/zap.yaml
      - name: Fix Workspace Permissions for ZAP Docker
        run: sudo chmod -R 777 ${{ github.workspace }}

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'http://localhost:3000'
          allow_issue_writing: true

      # Mencegah error 'Create Artifact Container failed' dengan memakai v4
      - name: Upload ZAP Scan Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-report
          path: |
            report_html.html
            report_md.md
            report_json.json
