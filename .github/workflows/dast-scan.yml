name: DAST Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  dast_scan:
    runs-on: ubuntu-latest
    name: Run DAST Scan with OWASP ZAP

    # FIX 1: Tambahkan blok permissions agar ZAP bisa membuat Issue
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # FIX 2: Pastikan server berjalan dan tunggu hingga endpoint mengembalikan HTTP 200 OK
      - name: Start Application & Healthcheck
        run: |
          npm install
          npm start &
          
          # Loop pengecekan hingga aplikasi mengembalikan HTTP 200 (maksimal 30 detik)
          echo "Waiting for application to be ready..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || true)
            if [ "$STATUS" -eq 200 ]; then
              echo "Application is ready with HTTP 200!"
              break
            fi
            echo "Waiting... (Current status: $STATUS)"
            sleep 1
          done

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          fail_action: false
          token: ${{ secrets.GITHUB_TOKEN }}
          issue_title: 'DAST Security Alert: Issue Found'
